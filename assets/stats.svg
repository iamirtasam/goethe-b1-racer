<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Typical run timings">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="0" y="0" width="285" height="140" rx="16" fill="#0d1224" stroke="#2a3358"/>
      <rect x="0" y="0" width="285" height="5" rx="2.5" fill="url(#acc)"/>
      <text x="142" y="75" font-size="46" font-weight="800" fill="#f8fafc">&lt; 0.4 s</text>
      <text x="142" y="108" font-size="15" letter-spacing="2" fill="#94a3b8">FLIP DETECTED</text>
    </g>
    <g transform="translate(305,0)">
      <rect width="285" height="140" rx="16" fill="#0d1224" stroke="#2a3358"/>
      <rect width="285" height="5" rx="2.5" fill="url(#acc)"/>
      <text x="142" y="75" font-size="46" font-weight="800" fill="#f8fafc">~ 1 s</text>
      <text x="142" y="108" font-size="15" letter-spacing="2" fill="#94a3b8">BOOKING ENTRY</text>
    </g>
    <g transform="translate(610,0)">
      <rect width="285" height="140" rx="16" fill="#0d1224" stroke="#2a3358"/>
      <rect width="285" height="5" rx="2.5" fill="url(#acc)"/>
      <text x="142" y="75" font-size="46" font-weight="800" fill="#f8fafc">10-14 s</text>
      <text x="142" y="108" font-size="15" letter-spacing="2" fill="#94a3b8">ORDER READY</text>
    </g>
    <g transform="translate(915,0)">
      <rect width="285" height="140" rx="16" fill="#0d1224" stroke="#2a3358"/>
      <rect width="285" height="5" rx="2.5" fill="url(#acc)"/>
      <text x="142" y="75" font-size="46" font-weight="800" fill="#f8fafc">12 / s</text>
      <text x="142" y="108" font-size="15" letter-spacing="2" fill="#94a3b8">ULTRA POLL RATE</text>
    </g>
  </g>
</svg>
